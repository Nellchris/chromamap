packages:
  - packages/*
  - apps/*

# Single source of truth for shared tool versions across the workspace.
# Packages reference these with "catalog:" so every package resolves the same
# vitest / typescript, and each package still gets its own node_modules/.bin.
catalog:
  "@types/node": ^26.6.5
  maplibre-gl: ^6.15.0
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.0.5
