name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here on purpose: package.json pins
      # "packageManager": "pnpm@10.x", and action-setup refuses to run when an
      # explicit version disagrees with it. Letting it read that field keeps
      # CI, this workflow and a developer's machine on one pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Reads the repository's Pages configuration. It does not turn Pages on:
      # `enablement: true` needs a token with admin rights, which GITHUB_TOKEN
      # is not, so it fails on a repository where Pages has never been set up.
      # Enable it once, by hand under Settings > Pages > Source: GitHub
      # Actions, or with:
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
