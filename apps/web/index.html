<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fafaf8" />
    <meta
      name="description"
      content="See how your map looks to people with colour vision deficiency. Audit a MapLibre style's colours, preview it through three kinds of colour blindness, and download an accessible palette."
    />
    <title>ChromaMap</title>

    <!-- A plain teal disc: the accent colour, nothing to decode at 16px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230e7490'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app" class="app" data-sidebar="open" data-view="landing">
      <!-- Screen one: what this is, and the two ways in. -->
      <main id="landing" class="landing"></main>

      <!-- Screen two: one map, or one palette, audited. -->
      <div id="audit" class="audit" hidden>
        <div class="map-wrap">
          <div id="map" class="map" role="application" aria-label="The map being audited"></div>

          <!--
            Stands in front of the map for an uploaded style, where there are
            colours to audit but no data to draw: the colours become the view.
          -->
          <section id="cover" class="cover" aria-label="Extracted map colours" hidden></section>

          <div class="map-caption" aria-live="polite">
            <p id="map-caption-title" class="map-caption-title"></p>
            <p id="map-caption-mode" class="map-caption-mode" hidden></p>
          </div>
        </div>

        <aside id="sidebar" class="sidebar" aria-label="Accessibility audit">
          <button
            id="sheet-handle"
            class="sheet-handle"
            type="button"
            aria-controls="sidebar"
            aria-expanded="true"
          >
            <span class="sheet-handle-bar" aria-hidden="true"></span>
            <span class="visually-hidden">Expand or collapse the audit panel</span>
          </button>

          <header class="sidebar-top">
            <a id="back" class="back" href="#">
              <span aria-hidden="true">←</span>
              <span>Back</span>
            </a>
            <div id="variant-mount"></div>
            <div id="score-mount"></div>
          </header>

          <div class="sidebar-scroll" id="sidebar-scroll"></div>
        </aside>

        <button
          id="sidebar-toggle"
          class="sidebar-toggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="true"
        >
          <span class="sidebar-toggle-glyph" aria-hidden="true">‹</span>
          <span class="visually-hidden">Collapse the audit panel</span>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
